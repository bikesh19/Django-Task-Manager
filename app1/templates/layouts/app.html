<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Flow{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar sticky-top mb-5">
    <div class="container">
        <a href="/" class="navbar-brand">TaskFlow</a>

        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small d-none d-md-block">Hello, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        {% endif %}
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="mt-5 py-4 border-top">
    <div class="container text-center text-muted">
        <p class="small mb-0">&copy; 2024 TaskFlow. Built with Django & ✨</p>
    </div>
</footer>

</body>
</html>
