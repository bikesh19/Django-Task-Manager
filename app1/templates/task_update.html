{% extends 'layouts/app.html'%}

{% block content %}

<div class="row animate-fade-in">
  <div class="col-lg-6 mx-auto">
    <div class="glass-card p-5">
      <div class="mb-4">
        <h2 class="mb-1">Edit Task</h2>
        <p class="text-muted">Modify the details of your task below.</p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-medium">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors }}</div>
            {% endif %}
          </div>
          {% endfor %}
        </div>

        <div class="d-flex gap-3 pt-3 border-top mt-4">
          <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
          <button type="submit" class="btn btn-primary flex-grow-1">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
